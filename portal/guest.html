<style>
  :root {
    --ink: #1b2236;
    --ink-2: #3c4459;
    --muted: #6e7180;
    --faint: #a19c8e;
    --gold: #a5824c;
    --gold-2: #c9ab78;
    --gold-soft: #f4ecdd;
    --ivory: #faf7f1;
    --paper: #fffdf9;
    --line: #e6dfd2;
    --line-2: #efe9dd;
    --sage: #56745d;
    --sage-soft: #e8f0e8;
    --amber: #a8742a;
    --amber-soft: #f7eddb;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  :lang(ja) {
    --serif: "Fraunces", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --sans: "Inter", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 500px at 50% -200px, #efe5d2 0%, rgba(239, 229, 210, 0) 70%),
      var(--ivory);
    color: var(--ink);
    font: 400 15px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  .page { max-width: 820px; margin: 0 auto; padding: 48px 20px 64px; }
  .topline {
    display: flex; justify-content: center; align-items: center; gap: 12px;
    margin-bottom: 26px;
    font: 600 10.5px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--gold);
  }
  .topline::before, .topline::after { content: ""; width: 44px; height: 1px; background: var(--gold-2); opacity: .7; }

  .letter {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(27, 34, 54, .04), 0 30px 60px -36px rgba(27, 34, 54, .35);
    padding: 56px 64px 48px;
  }
  .letter::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px;
    background: linear-gradient(90deg, var(--ink) 0 72%, var(--gold) 72% 100%);
    border-radius: 4px 4px 0 0;
  }

  .letterhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 14px; }
  .monogram {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--ink); color: var(--gold-2);
    font: italic 400 24px/1 var(--serif);
    box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px var(--gold-2);
  }
  .wordmark { font: 400 23px/1 var(--serif); letter-spacing: -.005em; }
  .wordmark em { font-style: italic; color: var(--gold); }
  .wordmark-sub { margin-top: 5px; font: 600 9.5px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
  .refblock { text-align: right; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
  .refblock strong { display: block; font: 500 14px/1.3 var(--sans); color: var(--ink); letter-spacing: .02em; font-variant-numeric: tabular-nums; }

  .hotel-line { margin-top: 26px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; color: var(--muted); font-size: 13px; }
  .hotel-line .hotel-name { font: 500 15px/1.3 var(--serif); color: var(--ink); }
  .eyebrow { margin-top: 30px; font: 600 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
  h1.subject { margin: 12px 0 0; font: 400 32px/1.2 var(--serif); letter-spacing: -.012em; color: var(--ink); text-wrap: balance; }
  .prepared { margin-top: 10px; color: var(--muted); font-size: 14px; }

  .outcome {
    margin-top: 30px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 18px 28px;
    align-items: center;
    padding: 24px 28px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fbf8f2;
  }
  .outcome.is-approved { background: linear-gradient(135deg, #f3f7f1 0%, #fbfaf5 100%); border-color: #cfdccf; }
  .outcome.is-review { background: linear-gradient(135deg, #faf3e6 0%, #fdfaf4 100%); border-color: #ead8b8; }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 10px; border-radius: 999px; font: 600 12px/1.2 var(--sans); background: #ecebe5; color: var(--ink-2); }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .is-approved .status { background: var(--sage-soft); color: var(--sage); }
  .is-review .status { background: var(--amber-soft); color: var(--amber); }
  .outcome-note { margin: 12px 0 0; color: var(--ink-2); font-size: 14px; max-width: 420px; }
  .figures { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; justify-content: flex-end; }
  .figure { text-align: right; }
  .figure-label { font: 600 10.5px/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .figure-value { margin-top: 6px; font: 400 38px/1 var(--serif); letter-spacing: -.015em; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
  .figure-value.small { font-size: 26px; color: var(--gold); }
  .figure-sub { margin-top: 6px; font-size: 12px; color: var(--muted); }

  .message { margin-top: 38px; }
  .section-label { display: flex; align-items: center; gap: 12px; font: 600 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 16px; }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .message-body {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: 400 17px/1.75 var(--serif);
    color: var(--ink);
    font-variation-settings: "opsz" 14;
  }
  .message-body:lang(ja) { font-size: 16px; line-height: 2; letter-spacing: .02em; }

  .stay { margin-top: 38px; }
  .stay-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .stay-cell { padding: 14px 18px; border-right: 1px solid var(--line-2); min-width: 0; }
  .stay-cell:last-child { border-right: 0; }
  .stay-k { font: 600 10px/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .stay-v { margin-top: 6px; font-size: 14px; color: var(--ink); line-height: 1.4; }
  .stay-v small { display: block; color: var(--muted); font-size: 12.5px; }

  .policies { margin-top: 38px; }
  .policies-note { margin: -6px 0 14px; color: var(--muted); font-size: 13px; }
  .policy-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .policy {
    display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 16px; align-items: center;
    padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .policy:hover { border-color: var(--gold-2); box-shadow: 0 8px 20px -14px rgba(27, 34, 54, .4); }
  .doc-icon {
    width: 34px; height: 42px; border-radius: 3px 10px 3px 3px; border: 1px solid var(--line);
    display: grid; place-items: center; background: var(--ivory);
    font: 700 9px/1 var(--sans); letter-spacing: .06em; color: #a6493c;
  }
  .policy-title { font: 500 15px/1.35 var(--serif); color: var(--ink); }
  .policy-en { margin-top: 2px; font-size: 12.5px; color: var(--muted); font-style: italic; }
  .policy-meta { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: var(--ivory); border: 1px solid var(--line-2); color: var(--ink-2); font-size: 11.5px; white-space: nowrap; }
  .tag.lang b { font: 700 9.5px/1 var(--sans); letter-spacing: .05em; color: #fff; background: var(--ink); padding: 2px 4px; border-radius: 3px; }
  .tag.seasonal { background: var(--gold-soft); border-color: #e7d6b6; color: #7c5f31; }
  .docid { font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--faint); }
  .open {
    display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 8px;
    background: var(--ink); color: #fff; text-decoration: none; font: 500 12.5px/1 var(--sans); white-space: nowrap;
  }
  .open:hover { background: #283252; }
  .open:focus-visible, .print:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .open svg { width: 14px; height: 14px; }
  .empty-policies { padding: 16px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 13.5px; }

  .closing { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .closing-text { font-size: 12.5px; color: var(--muted); line-height: 1.6; max-width: 520px; }
  .print {
    display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-2); font: 500 12.5px/1 var(--sans); cursor: pointer;
    white-space: nowrap; flex: none;
  }
  .print svg { width: 14px; height: 14px; }
  .print:hover { border-color: var(--gold-2); color: var(--ink); }

  .colophon { margin-top: 26px; text-align: center; font-size: 11.5px; color: var(--faint); letter-spacing: .02em; }

  /* states */
  .state { text-align: center; padding: 70px 24px; }
  .state h1 { margin: 22px 0 8px; font: 400 26px/1.25 var(--serif); }
  .state p { margin: 0 auto; max-width: 420px; color: var(--muted); }
  .ring { width: 34px; height: 34px; margin: 0 auto; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--gold); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton { margin-top: 30px; display: grid; gap: 12px; }
  .skeleton span { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #f1ece2, #f8f4ec, #f1ece2); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  @media (max-width: 720px) {
    .page { padding: 20px 12px 40px; }
    .topline { margin-bottom: 16px; }
    .letter { padding: 34px 22px 30px; }
    .letterhead { flex-direction: column; gap: 18px; }
    .refblock { text-align: left; }
    h1.subject { font-size: 25px; }
    .outcome { grid-template-columns: minmax(0, 1fr); padding: 20px; }
    .figures { justify-content: flex-start; gap: 22px; }
    .figure { text-align: left; }
    .figure-value { font-size: 32px; }
    .message-body { font-size: 16px; }
    .stay-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stay-cell:nth-child(2) { border-right: 0; }
    .stay-cell:nth-child(-n+2) { border-bottom: 1px solid var(--line-2); }
    .policy { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .doc-icon { display: none; }
    .open { justify-self: start; }
  }
  @media (prefers-reduced-motion: reduce) { .ring, .skeleton span { animation: none; } }

  @media print {
    @page { margin: 16mm 14mm; }
    body { background: #fff; font-size: 11pt; }
    .page { max-width: none; padding: 0; }
    .topline, .print, .colophon { display: none; }
    .letter { border: 0; box-shadow: none; padding: 0; }
    .letter::before { display: none; }
    .outcome, .policy, .stay-grid { break-inside: avoid; }
    .outcome { background: #fff !important; }
    .open { background: none; color: var(--ink); border: 1px solid var(--line); }
    .message-body { font-size: 12pt; }
  }
</style>
</head>

      print: "Stampa", statutory: "Questa decisione non limita i suoi diritti di legge.",
      contact: "Domande? Scriva a guest.relations@reverieescapes.example indicando il riferimento.",
      errorTitle: "Questo link non è più valido", errorText: "Il link potrebbe essere scaduto o incompleto. Utilizzi il link ricevuto via e-mail.",
      networkTitle: "Al momento non è possibile mostrare la risposta", networkText: "Riprovi tra qualche minuto."
    },
    ja: {
      locale: "ja-JP", topline: "ゲストリレーションズ", eyebrow: "ご滞在に関するご回答", loading: "ご回答を読み込んでいます…",
      reference: "受付番号", decidedOn: "決定日", preparedFor: function (n) { return n + " 様"; },
      outcome: { REFUND_APPROVED: "返金が承認されました", NO_REFUND: "返金の対象外となりました", UNDER_REVIEW: "引き続き確認中です" },
      note: {
        REFUND_APPROVED: "ご予約時のお支払い方法へ返金いたします。",
        NO_REFUND: "下記の規程に基づき確認いたしましたが、今回は補償の対象となりませんでした。",
        UNDER_REVIEW: "担当者が引き続き内容を確認しております。"
      },
      refund: "返金額", points: "ボーナスポイント", pointsSub: "Reverie Circle",
      message: "ゲストリレーションズからのメッセージ", stay: "ご滞在内容", hotel: "ホテル", dates: "ご滞在日", room: "客室", guest: "お客様",
      nights: function (n) { return n + "泊"; },
      policies: "本決定で参照した規程", policiesNote: "各規程は原語版を正文とします。",
      noPolicies: "本決定に添付された規程はありません。",
      openPdf: "PDFを開く", effective: "適用期間", untilReplaced: "改定まで", seasonal: "季節規程", base: "規程",
      scope: { GLOBAL: "グローバル", REGION: "地域", COUNTRY: "国別", HOTEL: "ホテル" },
      print: "印刷", statutory: "本決定は、お客様の法令上の権利を制限するものではありません。",
      contact: "ご不明な点は、受付番号を添えて guest.relations@reverieescapes.example までお問い合わせください。",
      errorTitle: "このリンクは無効です", errorText: "リンクの有効期限が切れているか、正しくない可能性があります。メールに記載のリンクをご利用ください。",
      networkTitle: "現在ご回答を表示できません", networkText: "しばらくしてから再度お試しください。"
    }
  };

  var config = window.REVERIE_CONFIG || {};
  var apiBase = String(config.refundApi || "http://localhost:8080").replace(/\/+$/, "");
  var letter = document.getElementById("letter");
  var token = new URLSearchParams(location.search).get("token");

  // Until the resolution loads, labels follow the browser language.
  var t = pick((navigator.language || "en").slice(0, 2));
  setLanguage(t);

  function pick(lang) {
    var code = String(lang || "en").toLowerCase().slice(0, 2);
    var dict = I18N[code] || I18N.en;
    dict.code = I18N[code] ? code : "en";
    return dict;
  }

  function setLanguage(dict) {
    document.documentElement.lang = dict.code;
    document.getElementById("topline").textContent = dict.topline;
    var lt = document.getElementById("loading-text");
    if (lt) lt.textContent = dict.loading;
  }

  // Builds an element; text is always set with textContent.
  function h(tag, attrs) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = String(v);
        else node.setAttribute(k, v === true ? "" : String(v));
      });
    }
    for (var i = 2; i < arguments.length; i++) add(node, arguments[i]);
    return node;
  }
  function add(node, child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) { child.forEach(function (c) { add(node, c); }); return; }
    node.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
  }

  function flag(cc) {
    if (!cc || !/^[A-Za-z]{2}$/.test(cc)) return "";
    return String.fromCodePoint.apply(null, cc.toUpperCase().split("").map(function (c) { return 0x1f1e6 + c.charCodeAt(0) - 65; }));
  }
  function date(iso, dict, opts) {
    if (!iso) return "";
    var dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(iso);
    var d = new Date(dateOnly ? iso + "T00:00:00Z" : iso);
    if (isNaN(d.getTime())) return String(iso);
    var o = Object.assign({ day: "numeric", month: "long", year: "numeric" }, opts || {});
    if (dateOnly) o.timeZone = "UTC";
    return new Intl.DateTimeFormat(dict.locale, o).format(d);
  }
  function money(amount, currency, dict) {
    var n = Number(amount);
    if (!isFinite(n)) return "";
    try { return new Intl.NumberFormat(dict.locale, { style: "currency", currency: currency }).format(n); }
    catch (e) { return currency + " " + n.toFixed(2); }
  }
  function number(n, dict) { return new Intl.NumberFormat(dict.locale).format(Number(n) || 0); }
  function languageName(code, dict) {
    try {
      var name = new Intl.DisplayNames([dict.locale], { type: "language" }).of(code);
      return name ? name.charAt(0).toLocaleUpperCase(dict.locale) + name.slice(1) : code;
    } catch (e) { return String(code || "").toUpperCase(); }
  }
  function icon(path) {
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "none"); svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.8"); svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    var p = document.createElementNS(ns, "path"); p.setAttribute("d", path); svg.appendChild(p);
    return svg;
  }

  function showState(title, text) {
    letter.replaceChildren(h("div", { class: "state" },
      h("div", { class: "brand", style: "justify-content:center" },
        h("div", { class: "monogram", "aria-hidden": "true", text: "R" })),
      h("h1", { text: title }),
      h("p", { text: text })));
  }

  function render(r) {
    var dict = pick(r.preferredLanguage);
    setLanguage(dict);
    document.title = (r.message && r.message.subject ? r.message.subject + " · " : "") + (r.hotel && r.hotel.name || "ReverieEscapes");

    var outcomeKey = dict.outcome[r.outcome] ? r.outcome : "UNDER_REVIEW";
    var outcomeClass = outcomeKey === "REFUND_APPROVED" ? " is-approved" : outcomeKey === "UNDER_REVIEW" ? " is-review" : "";
    var figures = [];
    if (r.refund && outcomeKey === "REFUND_APPROVED") {
      figures.push(h("div", { class: "figure" },
        h("div", { class: "figure-label", text: dict.refund }),
        h("div", { class: "figure-value", text: money(r.refund.amount, r.refund.currency, dict) })));
    }
    if (r.bonusPoints > 0) {
      figures.push(h("div", { class: "figure" },
        h("div", { class: "figure-label", text: dict.points }),
        h("div", { class: "figure-value small", text: "+" + number(r.bonusPoints, dict) }),
        h("div", { class: "figure-sub", text: dict.pointsSub })));
    }

    var hotel = r.hotel || {};
    var stay = r.stay || {};
    var message = r.message || {};
    var msgLang = message.language || dict.code;

    var policies = (r.policies || []).map(function (p) {
      var href = apiBase + p.documentUrl;
      var window_ = date(p.effectiveFrom, dict, { month: "short" }) + " – " + (p.effectiveTo ? date(p.effectiveTo, dict, { month: "short" }) : dict.untilReplaced);
      return h("li", { class: "policy" },
        h("div", { class: "doc-icon", "aria-hidden": "true", text: "PDF" }),
        h("div", null,
          h("div", { class: "policy-title", lang: p.language, text: p.title }),
          p.titleEnglish && p.titleEnglish !== p.title && dict.code !== p.language
            ? h("div", { class: "policy-en", lang: "en", text: p.titleEnglish }) : null,
          h("div", { class: "policy-meta" },
            h("span", { class: "tag lang" }, h("b", { text: String(p.language || "").toUpperCase() }), languageName(p.language, dict)),
            h("span", { class: "tag", text: (dict.scope[p.scope] || p.scope) + " · " + (p.policyType === "SEASONAL" ? dict.seasonal : dict.base) }),
            p.policyType === "SEASONAL" ? h("span", { class: "tag seasonal", text: window_ }) : h("span", { class: "tag", text: dict.effective + " " + window_ }),
            h("span", { class: "docid", text: p.documentId }))),
        h("a", { class: "open", href: href, target: "_blank", rel: "noopener", "aria-label": dict.openPdf + ": " + p.title },
          icon("M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M12 18v-6 M9 15l3 3 3-3"), dict.openPdf));
    });

    var printBtn = h("button", { class: "print", type: "button" },
      icon("M6 9V2h12v7 M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2 M6 14h12v8H6z"), dict.print);
    printBtn.addEventListener("click", function () { window.print(); });

    letter.replaceChildren(
      h("header", { class: "letterhead" },
        h("div", { class: "brand" },
          h("div", { class: "monogram", "aria-hidden": "true", text: "R" }),
          h("div", null,
            h("div", { class: "wordmark" }, "Reverie", h("em", { text: "Escapes" })),
            h("div", { class: "wordmark-sub", text: "Hotels & Resorts" }))),
        h("div", { class: "refblock" },
          dict.reference, h("strong", { text: r.caseNumber || "" }),
          r.decidedAt ? h("span", null, dict.decidedOn + " " + date(r.decidedAt, dict)) : null)),

      h("div", { class: "hotel-line" },
        h("span", { class: "hotel-name", text: hotel.name || "" }),
        h("span", { text: [hotel.city, hotel.countryName].filter(Boolean).join(", ") + (hotel.countryCode ? " " + flag(hotel.countryCode) : "") })),

      h("div", { class: "eyebrow", text: dict.eyebrow }),
      h("h1", { class: "subject", lang: msgLang, text: message.subject || dict.outcome[outcomeKey] }),
      r.guestName ? h("div", { class: "prepared", text: dict.preparedFor(r.guestName) }) : null,

      h("section", { class: "outcome" + outcomeClass, "aria-label": dict.outcome[outcomeKey] },
        h("div", null,
          h("span", { class: "status", text: dict.outcome[outcomeKey] }),
          h("p", { class: "outcome-note", text: dict.note[outcomeKey] })),
        figures.length ? h("div", { class: "figures" }, figures) : null),

      message.body ? h("section", { class: "message" },
        h("div", { class: "section-label", text: dict.message }),
        h("div", { class: "message-body", lang: msgLang, text: message.body })) : null,

      h("section", { class: "stay" },
        h("div", { class: "section-label", text: dict.stay }),
        h("div", { class: "stay-grid" },
          cell(dict.hotel, hotel.name, hotel.city),
          cell(dict.dates, date(stay.checkIn, dict, { month: "short" }) + " – " + date(stay.checkOut, dict, { month: "short" }), stay.nights ? dict.nights(stay.nights) : null),
          cell(dict.room, stay.roomType, null),
          cell(dict.guest, r.guestName, null))),

      h("section", { class: "policies" },
        h("div", { class: "section-label", text: dict.policies }),
        h("p", { class: "policies-note", text: dict.policiesNote }),
        policies.length ? h("ul", { class: "policy-list" }, policies) : h("div", { class: "empty-policies", text: dict.noPolicies })),

      h("footer", { class: "closing" },
        h("div", { class: "closing-text" }, h("div", { text: dict.statutory }), h("div", { text: dict.contact })),
        printBtn));
  }

  function cell(k, v, sub) {
    return h("div", { class: "stay-cell" },
      h("div", { class: "stay-k", text: k }),
      h("div", { class: "stay-v" }, v || "—", sub ? h("small", { text: sub }) : null));
  }

  if (!token) {
    showState(t.errorTitle, t.errorText);
    return;
  }

  fetch(apiBase + "/guest/resolutions/" + encodeURIComponent(token), { headers: { Accept: "application/json" } })
    .then(function (res) {
      if (res.status === 404) { showState(t.errorTitle, t.errorText); return null; }
      if (!res.ok) throw new Error(String(res.status));
      return res.json();
    })
    .then(function (data) { if (data) render(data); })
    .catch(function () { showState(t.networkTitle, t.networkText); });
})();
</script>
